name: Mutation Testing

# Advisory only. Scoped to the financial-critical modules listed in stryker.config.mjs. Never
# gates merges and never runs on pull_request/push -- mutation testing is far slower than the
# required CI checks in ci.yml, so it runs on a schedule and on demand only. See AGENTS.md's
# "Mutation testing" section.

on:
  schedule:
    - cron: "0 6 * * 0" # weekly, Sunday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation-testing:
    name: Mutation testing (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run scoped mutation testing
        run: npm run mutation:test
        continue-on-error: true

      - name: Report mutation score by file
        run: npm run mutation:report

      - name: Upload mutation HTML report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 30
