name: Release and Tags Workflow

on:
  pull_request:
    branches:
      - master
    types:
      - closed

jobs:
  create-tag-and-release:
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'develop'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Extract version from package.json
        id: release
        run: |
          VERSION=$(node -p "require('./package.json').version")

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid package.json version: $VERSION"
            exit 1
          fi

          TAG="v$VERSION"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        run: |
          TAG=${{ steps.release.outputs.tag }}

          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG"
            exit 1
          fi

      - name: Check if version is newer than the latest release
        run: |
          TAG=${{ steps.release.outputs.tag }}
          LATEST_TAG=$(git tag --list "v*" --sort=-v:refname | head -n 1)

          if [[ -n "$LATEST_TAG" ]] && [[ "$(printf '%s\n' "$LATEST_TAG" "$TAG" | sort -V | tail -n 1)" != "$TAG" ]]; then
            echo "Version $TAG must be newer than the latest release: $LATEST_TAG"
            exit 1
          fi

      - name: Create git tag
        run: |
          TAG=${{ steps.release.outputs.tag }}

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Release ${{ steps.release.outputs.tag }}
          generate_release_notes: true
