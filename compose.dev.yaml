services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-homeledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homeledger}
      POSTGRES_DB: ${POSTGRES_DB:-homeledger}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  migrate:
    profiles: ["tools"]
    build:
      context: .
      target: migration
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-homeledger}:${POSTGRES_PASSWORD:-homeledger}@postgres:5432/${POSTGRES_DB:-homeledger}
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      target: development
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-homeledger}:${POSTGRES_PASSWORD:-homeledger}@postgres:5432/${POSTGRES_DB:-homeledger}
      WATCHPACK_POLLING: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next

volumes:
  postgres_dev_data:
  node_modules:
  next_cache:
