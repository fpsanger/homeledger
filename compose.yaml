services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-homeledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homeledger}
      POSTGRES_DB: ${POSTGRES_DB:-homeledger}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migrate:
    profiles: ["tools"]
    build:
      context: .
      target: migration
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-homeledger}:${POSTGRES_PASSWORD:-homeledger}@postgres:5432/${POSTGRES_DB:-homeledger}
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-homeledger}:${POSTGRES_PASSWORD:-homeledger}@postgres:5432/${POSTGRES_DB:-homeledger}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
