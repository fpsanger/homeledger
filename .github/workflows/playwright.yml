name: Playwright Tests

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Playwright Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: homeledger
          POSTGRES_PASSWORD: homeledger
          POSTGRES_DB: homeledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U homeledger -d homeledger"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://homeledger:homeledger@localhost:5432/homeledger

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Install Playwright Browsers
        # cdn.playwright.dev fronts Azure CDN and has served a certificate covering only
        # *.azureedge.net, which fails the download with ERR_TLS_CERT_ALTNAME_INVALID and
        # blocks the whole job. Fall back to Playwright's own Microsoft mirror so a bad
        # edge on either host cannot stop the suite from running.
        run: |
          npx playwright install --with-deps ||
            PLAYWRIGHT_DOWNLOAD_HOST=https://playwright.download.prss.microsoft.com \
              npx playwright install --with-deps
      - name: Run Playwright tests
        run: npx playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
